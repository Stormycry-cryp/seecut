[package]
name = "concat-editor-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local, read-only MCP bridge for the running SeeCut editor"

[lib]
path = "src/lib.rs"

[[bin]]
name = "seecut-editor-mcp"
path = "src/main.rs"
required-features = ["stdio"]

[features]
stdio = ["dep:rmcp", "dep:rmcp-macros", "dep:tokio", "dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
rmcp-macros = { version = "=3.4.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"], optional = true }
schemars = { version = "1", optional = true }
libc = "0.2"

[lints]
workspace = true
