name: CI

# The engine's tests and lints on every push and pull request. A green run
# on main is what nightly.yml waits for before it builds the app for every
# platform; see that file and release.yml for the bundles.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_window_diagnostic:
        description: Only capture the normal Linux App's ungranted Settings window
        type: boolean
        default: false
      linux_blackbox_qa:
        description: Run the reviewed independent black-box script instead of window capture
        type: boolean
        default: false
      qa_next_stage:
        description: Reviewed independent script stage
        type: choice
        options: ['observe-only', 'navigation', 'project-entry', 'canvas-create-observation', 'canvas-create-entry', 'editor-entry-observation', 'image-picker-observation', 'workflow-observation', 'fresh-workbench-observation', 'settings-controls-observation', 'canvas-entry-observation', 'workspaces-observation', 'assistant-entry-observation', 'assistant-config-observation', 'assets-import', 'asset-library-flow', 'clip-create-observation', 'clip-editor-entry', 'persistence-pair-observation']
        default: 'navigation'
      qa_ui_approval:
        description: Exact independent-QA UI JSON; forwarded unchanged, no automatic approval
        type: string
        default: ''
      qa_identity_approval:
        description: Exact main-reviewer runtime identity JSON; forwarded unchanged, no automatic approval
        type: string
        default: ''
      blackbox_timeout_seconds:
        description: Total QA time including cleanup (420 only for real lease expiry)
        type: choice
        options: ['300', '420']
        default: '300'
      qa_source_run_id:
        description: Exact prior candidate build run ID; empty builds a fresh candidate
        type: string
        default: ''
      qa_source_artifact_id:
        description: Exact immutable candidate artifact ID; required with source run ID
        type: string
        default: ''
      qa_source_head:
        description: Exact App source HEAD; required with both immutable candidate IDs
        type: string
        default: ''
      expected_sha:
        description: Exact 40-character feature HEAD required for the window diagnostic
        type: string
        default: ''

concurrency:
  # A manual window capture must not cancel the feature's ordinary CI.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && format('ci-window-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && (inputs.linux_blackbox_qa && 'Linux independent black-box QA' || 'Linux actual window diagnostic') || 'Engine tests and lints' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && 90 || 360 }}
    env:
      FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
      # See build-app.yml: the version the ort crate is built against.
      ORT_VERSION: 1.28.0
    steps:
      - uses: actions/checkout@v7
      - name: Verify the requested window candidate
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_RUN_ID: ${{ inputs.qa_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.qa_source_artifact_id }}
          SOURCE_HEAD: ${{ inputs.qa_source_head }}
          BLACKBOX_QA: ${{ inputs.linux_blackbox_qa }}
          NEXT_STAGE: ${{ inputs.qa_next_stage }}
          QA_SECONDS: ${{ inputs.blackbox_timeout_seconds }}
          QA_IDENTITY_APPROVAL: ${{ inputs.qa_identity_approval }}
          QA_UI_APPROVAL: ${{ inputs.qa_ui_approval }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          if [[ -n "$SOURCE_RUN_ID" || -n "$SOURCE_ARTIFACT_ID" || -n "$SOURCE_HEAD" ]]; then
            [[ "$BLACKBOX_QA" == true && "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ &&
               "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
          if [[ "$NEXT_STAGE" == workflow-observation || "$NEXT_STAGE" == persistence-pair-observation ]]; then
            [[ "$BLACKBOX_QA" == true && "$QA_SECONDS" == 300 &&
               "$SOURCE_RUN_ID" == 37340470010 && "$SOURCE_ARTIFACT_ID" == 11359607955 &&
               "$SOURCE_HEAD" == a6cf09ad935bbbc6cf792c4ac6a4b506a47aebd3 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]] || exit 1
          fi
          if [[ "$NEXT_STAGE" == settings-controls-observation || "$NEXT_STAGE" == canvas-entry-observation || "$NEXT_STAGE" == workspaces-observation || "$NEXT_STAGE" == assistant-entry-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == clip-create-observation ]]; then
            [[ "$BLACKBOX_QA" == true && "$QA_SECONDS" == 300 &&
               "$SOURCE_RUN_ID" == 37328783317 && "$SOURCE_ARTIFACT_ID" == 11355501142 &&
               "$SOURCE_HEAD" == 11ebf203e1a78d3b6a21677c4b17e96223c74b0e &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]] || exit 1
          fi
          if [[ "$NEXT_STAGE" == clip-editor-entry || "$NEXT_STAGE" == assistant-config-observation ]]; then
            [[ "$BLACKBOX_QA" == true && "$QA_SECONDS" == 300 &&
               "$SOURCE_RUN_ID" == 37385930165 && "$SOURCE_ARTIFACT_ID" == 11380395799 &&
               "$SOURCE_HEAD" == 0aa9406247e53f073c0b4df686adc68b40e2f8f6 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]] || exit 1
          fi
          if [[ "$NEXT_STAGE" == fresh-workbench-observation ]]; then
            [[ "$BLACKBOX_QA" == true && "$QA_SECONDS" == 300 &&
               "$SOURCE_RUN_ID" == 37312315509 && "$SOURCE_ARTIFACT_ID" == 11345919609 &&
               "$SOURCE_HEAD" == cecc8fdf9578675051dae58bda25f0ff805ce235 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]] || exit 1
          fi
          echo "Window candidate: $EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake; the
      # file dialogs link GTK on Linux.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake \
            mesa-vulkan-drivers vulkan-tools

      - name: Window diagnostic tools
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic
        env:
          NEXT_STAGE: ${{ inputs.qa_next_stage }}
          BLACKBOX_QA: ${{ inputs.linux_blackbox_qa }}
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb xdotool imagemagick fonts-noto-cjk libxkbcommon-x11-0
          if [[ "$BLACKBOX_QA" == true && ( "$NEXT_STAGE" == workflow-observation || "$NEXT_STAGE" == fresh-workbench-observation || "$NEXT_STAGE" == settings-controls-observation || "$NEXT_STAGE" == canvas-entry-observation || "$NEXT_STAGE" == workspaces-observation || "$NEXT_STAGE" == assistant-entry-observation || "$NEXT_STAGE" == assistant-config-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == clip-create-observation || "$NEXT_STAGE" == clip-editor-entry || "$NEXT_STAGE" == persistence-pair-observation ) ]]; then
            missing=()
            packages=(python3-gi gir1.2-atspi-2.0 dbus-x11 at-spi2-core)
            if [[ "$NEXT_STAGE" == workflow-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == persistence-pair-observation ]]; then
              packages+=(zenity)
            fi
            for package in "${packages[@]}"; do
              if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]]; then
                missing+=("$package")
              fi
            done
            if (( ${#missing[@]} )); then
              sudo apt-get install -y "${missing[@]}"
            fi
          fi

      - name: Software Vulkan adapter
        run: |
          set -euo pipefail
          dpkg -L mesa-vulkan-drivers | grep -E 'icd.d|vulkan_lvp'
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$VK_ICD_FILENAMES" ]]; then
            echo '::error::Mesa Lavapipe ICD manifest missing'
            exit 1
          fi
          echo "Using Vulkan ICD: $VK_ICD_FILENAMES"
          vulkaninfo --summary
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES" >> "$GITHUB_ENV"

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs, so the
      # libraries come from BtbN, and FFMPEG_DIR tells the bindings where.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"

      # ONNX Runtime as a shared library, linked dynamically, for the reason
      # build-app.yml gives: a static one beside sherpa-onnx's is the same
      # protobuf twice, and the test binary does not link. The tests then
      # find it through LD_LIBRARY_PATH, as they find FFmpeg.
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          curl -fsSL --retry 5 --retry-all-errors -o onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$stem.tgz"
          tar -xzf onnxruntime.tgz
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"

      - run: cargo fmt --check
        working-directory: src
      # Every string the interface shows is a key in a locale file; this
      # keeps en.json the inventory of them and every shipped language
      # keyed off it. See TRANSLATING.md.
      - run: python3 scripts/locales.py --check
      # The models Concat downloads are mirrored onto a release of this
      # repository; models/manifest.toml is what fills that mirror and the
      # engine's tables are what a download is checked against. This keeps
      # the two saying the same thing. See models/manifest.toml.
      - run: python3 scripts/models.py --check
      # -D warnings covers rustc lints too (missing_docs among them), so a
      # public item without documentation fails here, not in review. Lints
      # before tests: they finish in a fraction of the time and catch the
      # most.
      - run: |
          free -h
          df -h .
          /usr/bin/time -v cargo clippy --workspace --all-targets -- -D warnings
        if: github.event_name != 'workflow_dispatch' || inputs.linux_window_diagnostic != true
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "1"
      - run: cargo test --workspace -j 1
        if: github.event_name != 'workflow_dispatch' || inputs.linux_window_diagnostic != true
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
      # The gRPC transport is a feature nothing else in the workspace turns
      # on, so it is linted and tested here on its own. See concat-server.
      - run: cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings
        if: github.event_name != 'workflow_dispatch' || inputs.linux_window_diagnostic != true
        working-directory: src
      - run: cargo test -p concat-server --features grpc
        if: github.event_name != 'workflow_dispatch' || inputs.linux_window_diagnostic != true
        working-directory: src

      - name: Build the normal window candidate
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.qa_source_run_id == '' && inputs.qa_source_artifact_id == '' && inputs.qa_source_head == ''
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_BUILD_JOBS: '1'
        run: cargo build -p concat -j 1

      - name: Prepare the immutable normal App candidate
        id: candidate
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_RUN_ID: ${{ inputs.qa_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.qa_source_artifact_id }}
          SOURCE_HEAD: ${{ inputs.qa_source_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUN_ID" && -z "$SOURCE_ARTIFACT_ID" && -z "$SOURCE_HEAD" ]]; then
            python3 scripts/qa-candidate-artifact.py create \
              --app "$PWD/src/target/debug/concat" \
              --expected-head "$EXPECTED_SHA" \
              --output-dir "$RUNNER_TEMP/seecut-normal-candidate"
          else
            python3 scripts/qa-candidate-artifact.py restore \
              --source-run-id "$SOURCE_RUN_ID" --source-artifact-id "$SOURCE_ARTIFACT_ID" \
              --source-head "$SOURCE_HEAD" \
              --expected-head "$EXPECTED_SHA" \
              --output-dir "$RUNNER_TEMP/seecut-normal-candidate"
          fi
          python3 - <<'PYCANDIDATE'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'seecut-normal-candidate'
          data = json.loads((root / 'outputs.json').read_text())
          assert data['workflow_head'] == os.environ['EXPECTED_SHA']
          assert data['source_head'] == (os.environ['SOURCE_HEAD'] or os.environ['EXPECTED_SHA'])
          for key in ('binary_path', 'manifest_path'):
              path = Path(data[key])
              assert path.is_absolute() and path.is_file() and not path.is_symlink()
              assert '\n' not in str(path) and '\r' not in str(path)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('binary=' + data['binary_path'] + '\n')
              output.write('manifest=' + data['manifest_path'] + '\n')
              output.write('source_head=' + data['source_head'] + '\n')
              output.write('upload=' + str(not os.environ['SOURCE_RUN_ID']).lower() + '\n')
          PYCANDIDATE

      - name: Retain the immutable normal App candidate
        if: always() && steps.candidate.outcome == 'success' && steps.candidate.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seecut-linux-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/seecut-normal-candidate/candidate.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build the public stdio client
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa && inputs.qa_next_stage == 'project-entry'
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_BUILD_JOBS: '1'
        run: cargo build -p concat-editor-mcp --features stdio --bin seecut-editor-mcp -j 1

      - name: Capture the normal App window
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa != true
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          # Lavapipe is a CPU adapter; Slint requires an explicit opt-in.
          SLINT_WGPU_CPU: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp' \
            timeout --signal=TERM --kill-after=10s 290s \
            python3 scripts/check-linux-window.py \
            --binary "$PWD/src/target/debug/concat" \
            --output "$RUNNER_TEMP/seecut-window-evidence" \
            --expected-sha "$EXPECTED_SHA"

      - name: Run the independent black-box script
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa && inputs.qa_next_stage != 'persistence-pair-observation'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APP_BINARY: ${{ steps.candidate.outputs.binary }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.manifest }}
          SOURCE_HEAD: ${{ steps.candidate.outputs.source_head }}
          SOURCE_RUN_ID: ${{ inputs.qa_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.qa_source_artifact_id }}
          QA_SECONDS: ${{ inputs.blackbox_timeout_seconds }}
          NEXT_STAGE: ${{ inputs.qa_next_stage }}
          QA_IDENTITY_APPROVAL: ${{ inputs.qa_identity_approval }}
          QA_UI_APPROVAL: ${{ inputs.qa_ui_approval }}
          SLINT_WGPU_CPU: '1'
        run: |
          set -euo pipefail
          [[ "$QA_SECONDS" == 300 || "$QA_SECONDS" == 420 ]]
          [[ "$NEXT_STAGE" == observe-only || "$NEXT_STAGE" == navigation || "$NEXT_STAGE" == project-entry || "$NEXT_STAGE" == canvas-create-observation || "$NEXT_STAGE" == canvas-create-entry || "$NEXT_STAGE" == editor-entry-observation || "$NEXT_STAGE" == image-picker-observation || "$NEXT_STAGE" == workflow-observation || "$NEXT_STAGE" == fresh-workbench-observation || "$NEXT_STAGE" == settings-controls-observation || "$NEXT_STAGE" == canvas-entry-observation || "$NEXT_STAGE" == workspaces-observation || "$NEXT_STAGE" == assistant-entry-observation || "$NEXT_STAGE" == assistant-config-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == clip-create-observation || "$NEXT_STAGE" == clip-editor-entry ]]
          CANDIDATE_ARGS=(--candidate-manifest "$CANDIDATE_MANIFEST" --source-head "$SOURCE_HEAD")
          if [[ -n "$SOURCE_ARTIFACT_ID" ]]; then
            CANDIDATE_ARGS+=(--candidate-artifact-id "$SOURCE_ARTIFACT_ID")
          fi
          CLIENT_ARGS=()
          if [[ "$NEXT_STAGE" == project-entry ]]; then
            CLIENT_ARGS=(--client-binary "$PWD/src/target/debug/seecut-editor-mcp")
          fi
          DISPLAY_CAPTURE_ARGS=()
          if [[ "$NEXT_STAGE" == image-picker-observation || "$NEXT_STAGE" == workflow-observation || "$NEXT_STAGE" == fresh-workbench-observation || "$NEXT_STAGE" == settings-controls-observation || "$NEXT_STAGE" == canvas-entry-observation || "$NEXT_STAGE" == workspaces-observation || "$NEXT_STAGE" == assistant-entry-observation || "$NEXT_STAGE" == assistant-config-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == clip-create-observation || "$NEXT_STAGE" == clip-editor-entry ]]; then
            DISPLAY_CAPTURE_ARGS=(--isolated-display-capture)
          fi
          QA_SCRIPT="$PWD/scripts/independent-linux-blackbox.py"
          BUS_COMMAND=()
          BUS_ARGS=()
          INPUT_ARGS=()
          if [[ "$NEXT_STAGE" == workflow-observation ]]; then
            [[ "$QA_SECONDS" == 300 && "$SOURCE_RUN_ID" == 37340470010 &&
               "$SOURCE_ARTIFACT_ID" == 11359607955 && "$SOURCE_HEAD" == a6cf09ad935bbbc6cf792c4ac6a4b506a47aebd3 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
            QA_SCRIPT="$PWD/scripts/style-workflow-controller.py"
            BUS_COMMAND=(dbus-run-session --)
            BUS_ARGS=(--private-accessibility-bus)
            INPUT_ARGS=(--input-dir "$PWD/scripts/qa-fixtures")
          elif [[ "$NEXT_STAGE" == fresh-workbench-observation ]]; then
            [[ "$QA_SECONDS" == 300 && "$SOURCE_ARTIFACT_ID" == 11345919609 &&
               "$SOURCE_HEAD" == cecc8fdf9578675051dae58bda25f0ff805ce235 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
            QA_SCRIPT="$PWD/scripts/independent-next-ui.py"
            BUS_COMMAND=(dbus-run-session --)
            BUS_ARGS=(--private-accessibility-bus)
          elif [[ "$NEXT_STAGE" == settings-controls-observation || "$NEXT_STAGE" == canvas-entry-observation ]]; then
            # One invocation owns one fresh App and one independently reviewed A2 scope.
            [[ "$QA_SECONDS" == 300 && "$SOURCE_RUN_ID" == 37328783317 &&
               "$SOURCE_ARTIFACT_ID" == 11355501142 && "$SOURCE_HEAD" == 11ebf203e1a78d3b6a21677c4b17e96223c74b0e &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
            QA_SCRIPT="$PWD/scripts/next_ui_11ebf20_a3.py"
            BUS_COMMAND=(dbus-run-session --)
            BUS_ARGS=(--private-accessibility-bus)
          elif [[ "$NEXT_STAGE" == clip-editor-entry || "$NEXT_STAGE" == assistant-config-observation ]]; then
            [[ "$QA_SECONDS" == 300 && "$SOURCE_RUN_ID" == 37385930165 &&
               "$SOURCE_ARTIFACT_ID" == 11380395799 && "$SOURCE_HEAD" == 0aa9406247e53f073c0b4df686adc68b40e2f8f6 &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
            if [[ "$NEXT_STAGE" == assistant-config-observation ]]; then
              QA_SCRIPT="$PWD/scripts/assistant-0aa/agent-config-controller.py"
            else
              QA_SCRIPT="$PWD/scripts/clip-editor-controller.py"
            fi
            BUS_COMMAND=(dbus-run-session --)
            BUS_ARGS=(--private-accessibility-bus)
          elif [[ "$NEXT_STAGE" == workspaces-observation || "$NEXT_STAGE" == assistant-entry-observation || "$NEXT_STAGE" == assets-import || "$NEXT_STAGE" == asset-library-flow || "$NEXT_STAGE" == clip-create-observation ]]; then
            [[ "$QA_SECONDS" == 300 && "$SOURCE_RUN_ID" == 37328783317 &&
               "$SOURCE_ARTIFACT_ID" == 11355501142 && "$SOURCE_HEAD" == 11ebf203e1a78d3b6a21677c4b17e96223c74b0e &&
               -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
            if [[ "$NEXT_STAGE" == workspaces-observation ]]; then
              QA_SCRIPT="$PWD/scripts/workspaces-ui-11ebf20.py"
            elif [[ "$NEXT_STAGE" == asset-library-flow ]]; then
              QA_SCRIPT="$PWD/scripts/asset-flow-controller.py"
              INPUT_ARGS=(--input-dir "$PWD/scripts/qa-fixtures")
            elif [[ "$NEXT_STAGE" == assets-import ]]; then
              QA_SCRIPT="$PWD/scripts/asset-clip-assets-controller.py"
              INPUT_ARGS=(--input-dir "$PWD/scripts/qa-fixtures")
            elif [[ "$NEXT_STAGE" == clip-create-observation ]]; then
              QA_SCRIPT="$PWD/scripts/asset-clip-clip-controller.py"
            else
              QA_SCRIPT="$PWD/scripts/agent-native-entry-controller.py"
            fi
            BUS_COMMAND=(dbus-run-session --)
            BUS_ARGS=(--private-accessibility-bus)
          fi
          APPROVAL_ARGS=()
          if [[ -n "$QA_IDENTITY_APPROVAL" ]]; then
            python3 - <<'PYAPPROVAL'
          import os
          from pathlib import Path
          data = os.environ['QA_IDENTITY_APPROVAL'].encode('utf-8')
          assert len(data) <= 16384, 'Runtime declaration exceeds 16 KiB'
          path = Path(os.environ['RUNNER_TEMP']) / 'qa-identity-approval.json'
          with path.open('xb') as stream:
              os.fchmod(stream.fileno(), 0o600)
              stream.write(data)
          PYAPPROVAL
            APPROVAL_ARGS=(--identity-approval "$RUNNER_TEMP/qa-identity-approval.json")
          fi
          UI_ARGS=()
          if [[ -n "$QA_UI_APPROVAL" ]]; then
            python3 - <<'PYUIAPPROVAL'
          import os
          from pathlib import Path
          data = os.environ['QA_UI_APPROVAL'].encode('utf-8')
          assert len(data) <= 16384, 'UI declaration exceeds 16 KiB'
          path = Path(os.environ['RUNNER_TEMP']) / 'qa-ui-approval.json'
          with path.open('xb') as stream:
              os.fchmod(stream.fileno(), 0o600)
              stream.write(data)
          PYUIAPPROVAL
            UI_ARGS=(--ui-approval "$RUNNER_TEMP/qa-ui-approval.json")
          fi
          xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp' \
            timeout --signal=TERM --kill-after=10s "$((QA_SECONDS - 10))s" \
            "${BUS_COMMAND[@]}" \
            python3 scripts/run-linux-blackbox.py \
            --binary "$APP_BINARY" \
            --qa-script "$QA_SCRIPT" \
            --output "$RUNNER_TEMP/seecut-window-evidence" \
            --expected-sha "$EXPECTED_SHA" --seconds "$QA_SECONDS" \
            --next-stage "$NEXT_STAGE" "${CANDIDATE_ARGS[@]}" "${CLIENT_ARGS[@]}" "${APPROVAL_ARGS[@]}" "${UI_ARGS[@]}" "${DISPLAY_CAPTURE_ARGS[@]}" "${BUS_ARGS[@]}" "${INPUT_ARGS[@]}"

      - name: Run two finite App lifetimes on the original portable state
        if: github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa && inputs.qa_next_stage == 'persistence-pair-observation'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APP_BINARY: ${{ steps.candidate.outputs.binary }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.manifest }}
          SOURCE_HEAD: ${{ steps.candidate.outputs.source_head }}
          SOURCE_RUN_ID: ${{ inputs.qa_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.qa_source_artifact_id }}
          QA_SECONDS: ${{ inputs.blackbox_timeout_seconds }}
          QA_IDENTITY_APPROVAL: ${{ inputs.qa_identity_approval }}
          QA_UI_APPROVAL: ${{ inputs.qa_ui_approval }}
          SLINT_WGPU_CPU: '1'
        run: |
          set -euo pipefail
          [[ "$QA_SECONDS" == 300 && "$SOURCE_RUN_ID" == 37340470010 &&
             "$SOURCE_ARTIFACT_ID" == 11359607955 && "$SOURCE_HEAD" == a6cf09ad935bbbc6cf792c4ac6a4b506a47aebd3 &&
             -n "$QA_IDENTITY_APPROVAL" && -n "$QA_UI_APPROVAL" ]]
          python3 -B - <<'PYAPPROVAL'
          import os
          from pathlib import Path
          for variable, name in (('QA_IDENTITY_APPROVAL', 'persistence-identity.json'), ('QA_UI_APPROVAL', 'persistence-ui.json')):
              data = os.environ[variable].encode('utf-8')
              assert len(data) <= 16384
              path = Path(os.environ['RUNNER_TEMP']) / name
              with path.open('xb') as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  stream.write(data)
          PYAPPROVAL
          # One dedicated display; pair launches two dedicated dbus-run-session parents serially.
          xvfb-run -a -s '-screen 0 1920x1200x24 -nolisten tcp' \
            timeout --signal=TERM --kill-after=10s 620s \
            python3 -B scripts/persistence-pair.py \
            --binary "$APP_BINARY" --candidate-manifest "$CANDIDATE_MANIFEST" \
            --expected-sha "$EXPECTED_SHA" \
            --identity-approval "$RUNNER_TEMP/persistence-identity.json" \
            --ui-approval "$RUNNER_TEMP/persistence-ui.json" \
            --input-dir "$PWD/scripts/qa-fixtures" \
            --output "$RUNNER_TEMP/seecut-window-evidence"
          # Existing private evidence sealing consumes only this bounded evidence tree.
          # The separate random state root and executable are never uploaded.

      - name: Seal private QA evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && inputs.linux_blackbox_qa
        run: |
          python3 scripts/seal-qa-evidence.py \
            --source "$RUNNER_TEMP/seecut-window-evidence" \
            --recipient "$PWD/scripts/qa-evidence-recipient.pem" \
            --output "$RUNNER_TEMP/seecut-private-qa-evidence"

      - name: Verify bounded window evidence
        id: window_evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/${{ inputs.linux_blackbox_qa && 'seecut-private-qa-evidence' || 'seecut-window-evidence' }}
        run: |
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          files = []
          if root.exists():
              assert root.is_dir() and not root.is_symlink(), 'Invalid evidence directory'
              for path in root.rglob('*'):
                  assert not path.is_symlink(), 'Evidence contains a symlink'
                  mode = path.stat().st_mode
                  if stat.S_ISDIR(mode):
                      continue
                  assert stat.S_ISREG(mode), 'Evidence contains a non-regular file'
                  files.append(path)
          size = sum(path.stat().st_size for path in files)
          assert size <= 15 * 1024 * 1024, 'Window evidence exceeds 15 MiB'
          print(f'Window evidence: {len(files)} files, {size} bytes')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'upload={str(bool(files)).lower()}\n')
          PY

      - name: Upload bounded window evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.linux_window_diagnostic && steps.window_evidence.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seecut-linux-${{ inputs.linux_blackbox_qa && 'private-qa' || 'window' }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ inputs.linux_blackbox_qa && 'seecut-private-qa-evidence' || 'seecut-window-evidence' }}
          if-no-files-found: ignore
          retention-days: 7

  # The engine crates that carry no native library build for the web. This
  # job is what keeps that true: a std::thread or a blocking wait that
  # creeps into concat-core or concat-project fails here, not when someone
  # next tries the target. See src/README.md for the list.
  web:
    if: github.event_name != 'workflow_dispatch' || inputs.linux_window_diagnostic != true
    name: Engine on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: wasm32
      - run: >
          cargo clippy
          -p concat-core -p concat-project -p concat-effects -p concat-render -p concat-text
          --features concat-render/gpu --target wasm32-unknown-unknown
          -- -D warnings
        working-directory: src
